name: Ascend
options:
  bundleIdPrefix: com.barsboldb.ascend

packages:
  swift-protobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: "1.28.0"
  grpc-swift:
    url: https://github.com/grpc/grpc-swift.git
    from: "2.0.0"
  grpc-swift-nio-transport:
    url: https://github.com/grpc/grpc-swift-nio-transport.git
    from: "1.0.0"
  grpc-swift-protobuf:
    url: https://github.com/grpc/grpc-swift-protobuf.git
    from: "1.0.0"

targets:
  Ascend:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources: [Ascend]
    dependencies:
      - package: swift-protobuf
        product: SwiftProtobuf
      - package: grpc-swift
        product: GRPCCore
      - package: grpc-swift-nio-transport
        product: GRPCNIOTransportHTTP2
      - package: grpc-swift-protobuf
        product: GRPCProtobuf
    info:
      path: Ascend/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: YES
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: NO
        UIApplicationSupportsIndirectInputEvents: YES
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.barsboldb.ascend
      PRODUCT_NAME: Ascend
      SWIFT_VERSION: "5.0"

schemes:
  Ascend:
    build:
      targets:
        Ascend: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
